#cloud-config
# SPDX-License-Identifier: AGPL-3.0-only
# Maintainer test of an unpublished build, as provider user-data. Build the bundle
# with deploy/test/prepare-bundle.ps1, upload it and bootstrap.sh to private HTTPS
# storage, then replace BOOTSTRAP_URL, BUNDLE_URL, SHA256, HOSTNAME and EMAIL.
# This is the same one command an operator can paste over SSH instead.
# No task branch, image, tag, or artifact needs to be published.
package_update: true
packages: [ca-certificates, curl, python3]
write_files:
  - path: /root/install-plaingym-local.sh
    permissions: '0700'
    content: |
      #!/bin/sh
      # SPDX-License-Identifier: AGPL-3.0-only
      set -eu
      umask 077
      curl --fail --silent --show-error --location --proto '=https' 'BOOTSTRAP_URL' \
        | sh -s -- --bundle-url 'BUNDLE_URL' --sha256 SHA256 -- --hostname HOSTNAME --email EMAIL
runcmd:
  - [sh, /root/install-plaingym-local.sh]
