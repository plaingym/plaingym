#cloud-config
# SPDX-License-Identifier: AGPL-3.0-only
# Replace VERSION (vX.Y.Z), HOSTNAME and EMAIL before use.
# Downloads the same release bootstrap as the one-command install route.
package_update: true
packages: [ca-certificates, curl]
write_files:
  - path: /root/install-plaingym.sh
    permissions: '0700'
    content: |
      #!/bin/sh
      # SPDX-License-Identifier: AGPL-3.0-only
      set -eu
      umask 077
      version=VERSION
      printf '%s\n' "$version" | grep -Eq '^v(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$' \
        || { echo 'Set a release version (vX.Y.Z)' >&2; exit 1; }
      staging=$(mktemp -d /root/plaingym-install.XXXXXXXX)
      trap 'rm -rf -- "$staging"' EXIT
      curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 300 \
        -o "$staging/bootstrap.sh" "https://github.com/plaingym/plaingym/releases/download/$version/bootstrap.sh"
      sh "$staging/bootstrap.sh" --hostname HOSTNAME --email EMAIL
runcmd:
  - [sh, /root/install-plaingym.sh]
