#cloud-config
# SPDX-License-Identifier: AGPL-3.0-only
# Replace COMMIT (a full reviewed commit SHA), HOSTNAME and EMAIL before use.
# For task validation, load the image and extracted deploy bundle first, then run
# install.sh --local-image; no task-branch image is published.
package_update: true
packages: [ca-certificates, curl]
write_files:
  - path: /root/install-plaingym.sh
    permissions: '0700'
    content: |
      #!/bin/sh
      # SPDX-License-Identifier: AGPL-3.0-only
      set -eu
      umask 077
      commit=COMMIT
      case "$commit" in *[!a-f0-9]*|'') echo 'Set a reviewed commit SHA' >&2; exit 1 ;; esac
      [ "${#commit}" -eq 40 ]
      staging=$(mktemp -d /root/plaingym-install.XXXXXXXX)
      trap 'rm -rf -- "$staging"' EXIT
      curl --fail --silent --show-error --location --proto '=https' "https://github.com/plaingym/plaingym/archive/$commit.tar.gz" -o "$staging/source.tar.gz"
      tar -xzf "$staging/source.tar.gz" --strip-components=1 -C "$staging"
      sh "$staging/deploy/install.sh" --hostname HOSTNAME --email EMAIL --image ghcr.io/plaingym/app:v0.0.0
runcmd:
  - [sh, /root/install-plaingym.sh]
