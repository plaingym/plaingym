# Laid over deploy/compose.yaml by run.mjs for the memory check. The shipped file is used as it is, so the memory limits,
# V8 heap flag, tuned Postgres, hardening and Caddyfile are the ones installs get. Changes:
#   - Caddy publishes no port: the load runs on the stack's own network.
#   - CPU caps on every service, so a run on a shared machine cannot take it over.
#   - An S3-compatible stand-in for the backup bucket (versitygw, as in e2e/compose.yaml).
services:
  caddy:
    ports: !reset []
    cpus: 0.5
  app:
    cpus: 1.0
    depends_on:
      s3: {condition: service_started}
  postgres:
    cpus: 1.0
  s3:
    image: versity/versitygw:v1.0.20@sha256:c2f9b9289d237b85736214dfbef376b7d092b8540e1456d547aaa35dd03ad0b3
    entrypoint: [sh, -c, 'mkdir -p /data/plaingym && exec versitygw --port :7070 --region auto posix /data']
    cpus: 0.5
    mem_limit: 256m
    environment:
      ROOT_ACCESS_KEY: ${MEMORY_S3_ACCESS_KEY:?required}
      ROOT_SECRET_KEY: ${MEMORY_S3_SECRET_KEY:?required}
    networks: [database]
