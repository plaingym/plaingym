# SPDX-License-Identifier: AGPL-3.0-only
name: Contributor License Agreement
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]
permissions: {}
jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The Actions token can comment on a pull request only with pull-requests write.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      # This privileged job never checks out a ref, installs packages, or runs repository code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0; verified commit object
        env:
          # Optional comma-separated numeric GitHub IDs; admin/maintain collaborators are also exempt.
          CLA_MAINTAINER_IDS: ${{ vars.CLA_MAINTAINER_IDS }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const { owner, repo } = context.repo;
            const api = github.rest;
            const phrase = 'I have read the CLA Document and I hereby sign the CLA';
            const signatureBranch = 'cla-signatures';
            const signaturePath = 'signatures/cla.json';
            const statusContext = 'CLA';
            const issueNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            if (!issueNumber) return;
            if (context.eventName === 'issue_comment' && !context.payload.issue?.pull_request) return;
            const { data: pr } = await api.pulls.get({ owner, repo, pull_number: issueNumber });
            if (pr.state !== 'open' || pr.base.repo.full_name !== `${owner}/${repo}`) return;
            const status = (state, description) => api.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, state, context: statusContext, description,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            await status('pending', 'Checking contributor agreement');
            let isAgreementCurrent;
            try {
              // Exemptions use authenticated GitHub identities, never a PR's branch or title.
              const maintainerIds = (process.env.CLA_MAINTAINER_IDS ?? '').split(',').map((id) => id.trim()).filter(Boolean);
              if (maintainerIds.some((id) => !/^\d+$/.test(id))) throw new Error('CLA_MAINTAINER_IDS must contain numeric GitHub user IDs');
              const dependencyBots = new Set(['dependabot[bot]', 'renovate[bot]']);
              const permissions = new Map();
              const isExempt = async (user) => {
                if (maintainerIds.includes(String(user.id))) return true;
                if (user.type === 'Bot') return dependencyBots.has(user.login);
                if (user.type !== 'User') return false;
                // Ask once per account in a run.
                if (!permissions.has(user.id)) {
                  permissions.set(user.id, api.repos.getCollaboratorPermissionLevel({ owner, repo, username: user.login })
                    .then(({ data }) => data.permission));
                }
                return ['admin', 'maintain'].includes(await permissions.get(user.id));
              };

              // Signers: the opener, then every commit's linked GitHub user account by ID. A commit
              // with no linked account, or by a bot, is covered by the opener's signature.
              if (pr.commits > 250) throw new Error('Too many commits to check the contributor agreement');
              const commits = await github.paginate(api.pulls.listCommits, { owner, repo, pull_number: issueNumber, per_page: 100 });
              const commitAuthors = new Map();
              for (const { author } of commits) {
                if (author && author.type === 'User' && author.id !== pr.user.id) commitAuthors.set(author.id, author);
              }
              const signers = [];
              for (const user of [pr.user, ...[...commitAuthors.values()].sort((a, b) => a.id - b.id)]) {
                if (!await isExempt(user)) signers.push({ id: user.id, login: user.login });
              }
              // The status belongs to the head commit, which other open pull requests may share.
              const listOtherOpeners = async () => {
                const pulls = await github.paginate(api.pulls.list, { owner, repo, state: 'open', per_page: 100 });
                const others = [];
                for (const other of pulls) {
                  if (other.number === issueNumber || other.head?.sha !== pr.head.sha || other.base?.repo?.full_name !== `${owner}/${repo}`) continue;
                  if (!await isExempt(other.user)) others.push(other);
                }
                return others;
              };
              if (signers.length === 0 && (await listOtherOpeners()).length === 0) {
                await status('success', 'Maintainer or approved dependency bot');
                return;
              }

              const { data: repository } = await api.repos.get({ owner, repo });
              const readDefaultSha = async () => {
                const { data: ref } = await api.git.getRef({ owner, repo, ref: `heads/${repository.default_branch}` });
                return ref.object.sha;
              };
              const readAgreement = async (ref) => {
                const { data } = await api.repos.getContent({ owner, repo, path: 'CLA.md', ref });
                return data;
              };
              const listComments = () => github.paginate(api.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
              const isOurPrompt = (comment) => comment.user?.login === 'github-actions[bot]'
                && comment.user?.type === 'Bot' && comment.body?.startsWith('<!-- plaingym-cla:');
              // The earliest trusted prompt is the one every run keeps and signs against.
              const listTrustedPromptsById = async () => (await listComments()).filter(isOurPrompt).sort((a, b) => a.id - b.id);
              const deletePrompt = async (commentId) => {
                try {
                  await api.issues.deleteComment({ owner, repo, comment_id: commentId });
                } catch (error) {
                  if (error.status !== 404) throw error; // Another run already removed it.
                }
              };

              async function readLedger() {
                let stored;
                try {
                  stored = (await api.repos.getContent({ owner, repo, path: signaturePath, ref: signatureBranch })).data;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                if (stored && (Array.isArray(stored) || stored.type !== 'file' || stored.encoding !== 'base64')) throw new Error('Invalid CLA signature store');
                const ledger = stored ? JSON.parse(Buffer.from(stored.content, 'base64').toString('utf8')) : { schemaVersion: 1, signatures: [] };
                if (ledger.schemaVersion !== 1 || !Array.isArray(ledger.signatures)) throw new Error('Unsupported CLA signature store');
                return { stored, ledger };
              }
              // An obsolete pass can re-evaluate once, using the agreement now on the default branch.
              for (let pass = 0; pass < 2; pass++) {
                // Until this pass reads its agreement, an error is checked against the previous pass's.
                // Read the agreement from the trusted default branch, pinned to one commit.
                const defaultSha = await readDefaultSha();
                const agreement = await readAgreement(defaultSha);
                if (Array.isArray(agreement) || agreement.type !== 'file' || agreement.encoding !== 'base64') throw new Error('Cannot read CLA.md');
                isAgreementCurrent = async () => {
                  const currentSha = await readDefaultSha();
                  try {
                    const currentAgreement = await readAgreement(currentSha);
                    return currentAgreement.type === 'file' && currentAgreement.sha === agreement.sha;
                  } catch (error) {
                    if (error.status === 404) return false;
                    throw error;
                  }
                };
                const text = Buffer.from(agreement.content, 'base64').toString('utf8');
                if (/\[TODO[^\]]*\]/i.test(text)) throw new Error('CLA.md has unresolved publication placeholders; a maintainer must complete it');
                const version = /^Version\s+(\S+)/m.exec(text)?.[1];
                if (!version) throw new Error('CLA.md must declare a version');
                const hash = createHash('sha256').update(text).digest('hex');
                const marker = `<!-- plaingym-cla:${hash} -->`;
                const isSigned = (ledger, user) => ledger.signatures.some((entry) => entry.userId === user.id && entry.claSha256 === hash);
                const unsignedIn = (ledger) => signers.filter((signer) => !isSigned(ledger, signer));
                const { ledger } = await readLedger();
                let unsigned = unsignedIn(ledger);
                if (unsigned.length > 0 && context.eventName === 'issue_comment') {
                  // Refetch the comment: payload strings are data and are never evaluated as code.
                  const { data: comment } = await api.issues.getComment({ owner, repo, comment_id: context.payload.comment.id });
                  const isCandidate = unsigned.some((signer) => signer.id === comment.user.id) && comment.user.type === 'User'
                    && comment.body.trim() === phrase
                    && comment.issue_url === `https://api.github.com/repos/${owner}/${repo}/issues/${issueNumber}`;
                  const [prompt] = isCandidate ? await listTrustedPromptsById() : [];
                  if (prompt?.body.startsWith(marker) && Date.parse(comment.updated_at) >= Date.parse(prompt.updated_at)) {
                    const signature = {
                      userId: comment.user.id, login: comment.user.login, commentId: comment.id,
                      signedAt: comment.updated_at, claVersion: version, claSha256: hash, claBlobSha: agreement.sha,
                    };
                    // Bootstrap only our fixed signature branch; never use a PR-controlled ref.
                    try {
                      await api.git.getRef({ owner, repo, ref: `heads/${signatureBranch}` });
                    } catch (error) {
                      if (error.status !== 404) throw error;
                      try {
                        await api.git.createRef({ owner, repo, ref: `refs/heads/${signatureBranch}`, sha: defaultSha });
                      } catch (error) {
                        if (error.status !== 422) throw error;
                        // Another run may have created the branch after our read.
                        await api.git.getRef({ owner, repo, ref: `heads/${signatureBranch}` });
                      }
                    }
                    // GitHub retains only one pending run per concurrency group. Let every
                    // event run, and merge signatures against the latest blob on conflict.
                    for (let attempt = 0; attempt < 5; attempt++) {
                      const { stored, ledger } = await readLedger();
                      unsigned = unsignedIn(ledger);
                      if (isSigned(ledger, comment.user)) break;
                      ledger.signatures.push(signature);
                      try {
                        await api.repos.createOrUpdateFileContents({
                          owner, repo, path: signaturePath, branch: signatureBranch,
                          message: `docs: record CLA signature for user ${comment.user.id}`,
                          content: Buffer.from(JSON.stringify(ledger, null, 2) + '\n').toString('base64'),
                          ...(stored ? { sha: stored.sha } : {}),
                        });
                        unsigned = unsignedIn(ledger);
                        break;
                      } catch (error) {
                        // A stale sha answers 409; a sha-less write to a file another run just created answers 422.
                        const conflict = error.status === 409 || (!stored && error.status === 422);
                        if (!conflict || attempt === 4) throw error;
                      }
                    }
                  }
                }
                if (unsigned.length > 0) {
                  const agreementMarkers = `${marker}\n<!-- plaingym-cla-blob:${agreement.sha} -->\n`;
                  // Mention every unsigned signer: the opener first, then by account ID.
                  const greeting = `${agreementMarkers}${unsigned.map((signer) => `@${signer.login}`).join(', ')}, please read `;
                  const body = `${greeting}[Contributor License Agreement v${version}](${context.serverUrl}/${owner}/${repo}/blob/${defaultSha}/CLA.md).\n\nReply with this exact comment to sign:\n\n> ${phrase}\n\nYou keep your copyright. Your signature records this agreement's SHA-256: \`${hash}\`.`;
                  let [prompt, ...duplicates] = await listTrustedPromptsById();
                  if (!prompt) {
                    // If the agreement moved, keep the created prompt only when it is the earliest trusted one.
                    const { data: created } = await api.issues.createComment({ owner, repo, issue_number: issueNumber, body });
                    const agreementCurrent = await isAgreementCurrent();
                    // A concurrent create may have posted the earliest prompt for another revision.
                    [prompt, ...duplicates] = await listTrustedPromptsById();
                    if (!agreementCurrent) {
                      if (prompt && prompt.id < created.id) await deletePrompt(created.id);
                      continue;
                    }
                  }
                  if (prompt) {
                    // Refresh for another agreement, or when the unsigned signers it mentions changed.
                    const needsRefresh = !prompt.body.startsWith(greeting);
                    if (needsRefresh || duplicates.length > 0) {
                      if (!await isAgreementCurrent()) continue;
                    }
                    if (needsRefresh) {
                      await api.issues.updateComment({ owner, repo, comment_id: prompt.id, body });
                      if (!await isAgreementCurrent()) continue;
                    }
                    for (const duplicate of duplicates) await deletePrompt(duplicate.id);
                  }
                  // A signing run may have completed while we were preparing the prompt.
                  unsigned = unsignedIn((await readLedger()).ledger);
                }
                if (unsigned.length > 0) {
                  if (!await isAgreementCurrent()) continue;
                  await status('failure', 'CLA signature required; see the signing comment');
                  // Also repair a failure request that was in flight when signing succeeded.
                  unsigned = unsignedIn((await readLedger()).ledger);
                  if (unsigned.some((signer) => signer.id !== pr.user.id)) core.setFailed('Every contributor to the pull request must sign CLA.md');
                  else if (unsigned.length > 0) core.setFailed('The pull request author must sign CLA.md');
                }
                if (unsigned.length === 0) {
                  if (!await isAgreementCurrent()) continue;
                  // Another open pull request with this head commit is covered only when its opener is exempt or signed.
                  const uncoveredPulls = async () => {
                    const others = await listOtherOpeners();
                    if (others.length === 0) return [];
                    const { ledger } = await readLedger();
                    return others.filter((other) => !isSigned(ledger, other.user));
                  };
                  let [uncovered] = await uncoveredPulls();
                  if (uncovered) {
                    await status('failure', 'Another pull request on this commit needs a CLA signature');
                    // Repair the same way when the other opener signed meanwhile.
                    [uncovered] = await uncoveredPulls();
                    if (uncovered) core.setFailed(`Pull request #${uncovered.number} has the same head commit and its author has not signed CLA.md`);
                    else if (!await isAgreementCurrent()) continue;
                  }
                  if (!uncovered) await status('success', signers.length > 0 ? 'Contributor agreement signed' : 'Maintainer or approved dependency bot');
                }
                break;
              }
            } catch (error) {
              let agreementCurrent = true;
              try {
                if (isAgreementCurrent) agreementCurrent = await isAgreementCurrent();
              } catch {
                // The recheck failed too: still report the original error.
              }
              if (agreementCurrent) await status('failure', 'CLA check needs maintainer attention');
              core.setFailed(error.message);
            }
