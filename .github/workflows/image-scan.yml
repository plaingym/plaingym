# SPDX-License-Identifier: AGPL-3.0-only
name: Image scan
# Pinned packages don't notice advisories published after a release. This builds the runtime image
# and scans it with Trivy (run from its image, pinned by digest). Every high and critical finding,
# fixed or not, excepted or not, is listed in the run log for review. A high advisory that has a
# fixed version fails the run unless deploy/trivy-ignore.yaml lists it; a critical one with a fixed
# version fails it unless deploy/trivy-ignore-critical.yaml lists it. The infrastructure job scans
# both platforms (amd64 and arm64) of the PostgreSQL and Caddy images deploy/compose.yaml pins the
# same way, failing on advisories only on the weekly and manual runs.
on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: ['task/**']
    paths:
      - 'deploy/Dockerfile'
      - 'deploy/apt-runtime*'
      - 'deploy/compose.yaml'
      - 'deploy/trivy-ignore.yaml'
      - 'deploy/trivy-ignore-critical.yaml'
      - '.github/workflows/image-scan.yml'
  pull_request:
    paths:
      - 'deploy/Dockerfile'
      - 'deploy/apt-runtime*'
      - 'deploy/compose.yaml'
      - 'deploy/trivy-ignore.yaml'
      - 'deploy/trivy-ignore-critical.yaml'
      - '.github/workflows/image-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-scan-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: true
env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  IMAGE: plaingym:v0.0.0-scan
jobs:
  scheduled-failure:
    needs: [scan, infrastructure]
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: scheduled-failure-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { reportScheduledFailure } = await import('${{ github.workspace }}/scripts/release/scheduled-failure.mjs');
            await reportScheduledFailure({ github, context, failed: true });
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Compute the build version
        run: echo "VERSION=$(node scripts/release/version-cli.mjs)" >> "$GITHUB_ENV"
      # Shares the amd64 cache scope with Image checks (deploy/README.md). Image checks builds on main only when no
      # passing run exists for the commit, so the weekly run on main is what leaves a cache that every other branch
      # can start from.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max,ignore-error=true
      - name: Save the image for the scan
        run: docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
      - name: List every high and critical advisory
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY_IMAGE" image --input /scan/image.tar \
            --cache-dir /scan/trivy-cache --scanners vuln --severity HIGH,CRITICAL \
            --no-progress --skip-version-check
      - name: Fail on fixable high advisories
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/deploy:/policy:ro" "$TRIVY_IMAGE" image --input /scan/image.tar \
            --cache-dir /scan/trivy-cache --scanners vuln --severity HIGH --ignorefile /policy/trivy-ignore.yaml \
            --ignore-unfixed --exit-code 1 --skip-db-update --no-progress --skip-version-check
      - name: Fail on fixable critical advisories
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/deploy:/policy:ro" "$TRIVY_IMAGE" image --input /scan/image.tar \
            --cache-dir /scan/trivy-cache --scanners vuln --severity CRITICAL --ignorefile /policy/trivy-ignore-critical.yaml \
            --ignore-unfixed --exit-code 1 --skip-db-update --no-progress --skip-version-check
  # The PostgreSQL and Caddy images installs run, which update.sh moves to with each release (docs/update-reference.md).
  # Trivy reads each from its registry by the pinned reference. A task branch or pull request only lists advisories.
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read the pinned images
        run: |
          . deploy/lib.sh
          postgres_image=$(compose_image deploy/compose.yaml postgres)
          caddy_image=$(compose_image deploy/compose.yaml caddy)
          printf '%s\n' "$postgres_image" | grep -Eq "$postgres_image_pattern"
          printf '%s\n' "$caddy_image" | grep -Eq "$caddy_image_pattern"
          printf 'POSTGRES_IMAGE=%s\nCADDY_IMAGE=%s\n' "$postgres_image" "$caddy_image" >> "$GITHUB_ENV"
      - name: List every high and critical advisory
        run: |
          for image in "$POSTGRES_IMAGE" "$CADDY_IMAGE"; do
            for platform in linux/amd64 linux/arm64; do
              echo "Scanning $image ($platform)"
              docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY_IMAGE" image "$image" --platform "$platform" \
                --cache-dir /scan/trivy-cache --scanners vuln --severity HIGH,CRITICAL \
                --no-progress --skip-version-check
            done
          done
      - name: Fail on fixable high advisories
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          status=0
          for image in "$POSTGRES_IMAGE" "$CADDY_IMAGE"; do
            for platform in linux/amd64 linux/arm64; do
              echo "Scanning $image ($platform)"
              docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/deploy:/policy:ro" "$TRIVY_IMAGE" image "$image" --platform "$platform" \
                --cache-dir /scan/trivy-cache --scanners vuln --severity HIGH --ignorefile /policy/trivy-ignore.yaml \
                --ignore-unfixed --exit-code 1 --skip-db-update --no-progress --skip-version-check || status=1
            done
          done
          exit "$status"
      - name: Fail on fixable critical advisories
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          status=0
          for image in "$POSTGRES_IMAGE" "$CADDY_IMAGE"; do
            for platform in linux/amd64 linux/arm64; do
              echo "Scanning $image ($platform)"
              docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/deploy:/policy:ro" "$TRIVY_IMAGE" image "$image" --platform "$platform" \
                --cache-dir /scan/trivy-cache --scanners vuln --severity CRITICAL --ignorefile /policy/trivy-ignore-critical.yaml \
                --ignore-unfixed --exit-code 1 --skip-db-update --no-progress --skip-version-check || status=1
            done
          done
          exit "$status"
