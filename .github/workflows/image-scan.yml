# SPDX-License-Identifier: AGPL-3.0-only
name: Image scan
# Pinned packages don't notice advisories published after a release. This builds the runtime image
# and scans it with Trivy (run from its image, pinned by digest). It fails on a high or critical
# advisory that has a fixed version, unless deploy/trivy-ignore.yaml lists it; every high and
# critical finding, fixed or not, is listed in the run log for review.
on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'deploy/Dockerfile'
      - 'deploy/apt-runtime*'
      - 'deploy/trivy-ignore.yaml'
      - '.github/workflows/image-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true
env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  IMAGE: plaingym:v0.0.0-scan
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Shares the amd64 cache scope with Image checks (deploy/README.md). Image checks builds on main only when no
      # passing run exists for the commit, so the weekly run on main is what leaves a cache that every other branch
      # can start from.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max,ignore-error=true
      - name: Save the image for the scan
        run: docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
      - name: List every high and critical advisory
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/deploy:/policy:ro" "$TRIVY_IMAGE" image --input /scan/image.tar \
            --cache-dir /scan/trivy-cache --scanners vuln --severity HIGH,CRITICAL --ignorefile /policy/trivy-ignore.yaml \
            --no-progress --skip-version-check
      - name: Fail on fixable advisories
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/deploy:/policy:ro" "$TRIVY_IMAGE" image --input /scan/image.tar \
            --cache-dir /scan/trivy-cache --scanners vuln --severity HIGH,CRITICAL --ignorefile /policy/trivy-ignore.yaml \
            --ignore-unfixed --exit-code 1 --skip-db-update --no-progress --skip-version-check
