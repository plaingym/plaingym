# SPDX-License-Identifier: AGPL-3.0-only
name: Repo compliance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compliance:
    # Each platform audits the optional dependencies actually installed for it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified commit object
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0; verified commit object
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6; verified commit object
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm compliance
