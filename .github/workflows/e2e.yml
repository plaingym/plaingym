# SPDX-License-Identifier: AGPL-3.0-only
name: End-to-end
# The production image behind Caddy with two installs (single-gym and demo): the M2.7 flows, the
# permission sweep, demo isolation, phone layouts, and signed downloads (e2e/README.md).
on:
  push:
    branches: [main, 'integration/**']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reuse:
    # main only receives fast-forwards of integration branches whose CI passed, so the same commit has
    # already been checked: reuse that run's result instead of repeating it. Any lookup failure checks again.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api "repos/${{ github.repository }}/actions/workflows/e2e.yml/runs?head_sha=${{ github.sha }}&status=success" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length' || echo 0)"
          if [ "$count" -gt 0 ]; then echo passed=true; else echo passed=false; fi >> "$GITHUB_OUTPUT"
  e2e:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.passed != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: pnpm --dir e2e install --frozen-lockfile
      # The runner image already has Chromium's system libraries; --with-deps would add an apt-get
      # download (fonts, xvfb) that can stall for many minutes on a slow package mirror.
      - run: pnpm --dir e2e exec playwright install chromium
        timeout-minutes: 5
      - run: pnpm --dir e2e check-types
      # Builds committed HEAD into the production image, starts the Compose stack, runs every spec, and
      # removes its containers and volumes afterwards, also on failure.
      - run: pnpm --dir e2e test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          path: e2e/coverage/
          retention-days: 7
          if-no-files-found: ignore
