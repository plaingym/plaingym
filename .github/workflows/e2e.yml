# SPDX-License-Identifier: AGPL-3.0-only
name: End-to-end
# The production image behind Caddy with three installs (single-gym, demo, and a multi-gym install of two gyms):
# the staff workflows, permission sweep, demo isolation, the multi-gym flows and cross-gym sweep, phone layouts,
# and signed downloads (e2e/README.md).
# A push that changes Markdown files only skips it; the nightly run still covers main.
on:
  push:
    branches: [main, 'task/**', 'integration/**']
    paths-ignore: ['**/*.md']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      ux_pass:
        description: Capture the UX pass, including Firefox and WebKit
        type: boolean
        default: false
permissions:
  contents: read
env:
  E2E_SHARD_COUNT: '4'
concurrency:
  group: e2e-${{ github.ref }}-${{ inputs.ux_pass && 'ux' || 'suite' }}
  cancel-in-progress: true
jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - id: matrix
        run: node e2e/ci.mjs matrix
  reuse:
    # main only receives fast-forwards of integration branches whose CI passed, so the same commit has
    # already been checked: reuse that run's result instead of repeating it. Any lookup failure checks again.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api "repos/${{ github.repository }}/actions/workflows/e2e.yml/runs?head_sha=${{ github.sha }}&status=success" \
            --jq '[.workflow_runs[] | select(.event == "push" and .id != ${{ github.run_id }})] | length' || echo 0)"
          if [ "$count" -gt 0 ]; then echo passed=true; else echo passed=false; fi >> "$GITHUB_OUTPUT"
  e2e:
    needs: [reuse, shards]
    if: ${{ !cancelled() && !inputs.ux_pass && needs.reuse.outputs.passed != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shards) }}
    env:
      E2E_BLOB_REPORT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: pnpm --dir e2e install --frozen-lockfile
      # The runner image already has Chromium's system libraries; --with-deps would add an apt-get
      # download (fonts, xvfb) that can stall for many minutes on a slow package mirror.
      - run: pnpm --dir e2e exec playwright install chromium
        timeout-minutes: 5
      - run: pnpm --dir e2e check-types
      - name: Assign whole files by recorded duration
        run: node e2e/ci.mjs shard-lists
      - name: Check every test belongs to exactly one shard
        if: matrix.shard == 1
        run: node e2e/ci.mjs inventory
      # Builds committed HEAD into the production image, starts the Compose stack, runs every spec, and
      # removes its containers and volumes afterwards, also on failure.
      # Dependencies would repeat fresh-setup in every members-mat shard. Without them the wizard
      # stays first on shard 1; other stacks complete setup through the single-gym fixture's API path.
      - run: pnpm --dir e2e test --test-list coverage/shard-${{ matrix.shard }}.txt --no-deps
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}
          overwrite: true
          path: e2e/coverage/
          retention-days: 7
          if-no-files-found: error
  changed-specs:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.specs.outputs.changed }}
      files: ${{ steps.specs.outputs.files }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - id: specs
        run: node e2e/ci.mjs changed-specs
  changed-specs-test:
    needs: changed-specs
    if: needs.changed-specs.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_CHANGED_SPECS: ${{ needs.changed-specs.outputs.files }}
    steps:
      # Full history, like the shards: the image's version comes from the release tags HEAD contains.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: pnpm --dir e2e exec playwright install chromium
        timeout-minutes: 5
      - name: Run changed specs on a fresh stack
        run: node e2e/ci.mjs run-changed
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-changed-specs
          overwrite: true
          path: e2e/coverage/
          retention-days: 7
          if-no-files-found: error
  report:
    needs: [reuse, e2e]
    if: ${{ !cancelled() && !inputs.ux_pass && needs.reuse.outputs.passed != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: pnpm --dir e2e install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-shard-*
          path: e2e/coverage/shards
      - name: Merge all shard reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: coverage/report
          PLAYWRIGHT_JSON_OUTPUT_NAME: coverage/results.json
        run: |
          mkdir -p e2e/coverage/blobs
          cp e2e/coverage/shards/e2e-shard-*/blob/*.zip e2e/coverage/blobs/
          pnpm --dir e2e exec playwright merge-reports --reporter=html,json coverage/blobs
          node e2e/ci.mjs verify-report
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          overwrite: true
          path: e2e/coverage/
          retention-days: 7
          if-no-files-found: error
  ux:
    if: ${{ inputs.ux_pass }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UX_PASS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: pnpm --dir e2e exec playwright install chromium
        timeout-minutes: 5
      - run: pnpm --dir e2e exec playwright install --with-deps firefox webkit
        timeout-minutes: 10
      - run: pnpm --dir e2e check-types
      - run: pnpm --dir e2e test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          overwrite: true
          path: e2e/coverage/
          retention-days: 7
          if-no-files-found: error
