# SPDX-License-Identifier: AGPL-3.0-only
name: Prerelease
# A nightly vX.Y.0-nightly.N prerelease of next's head, built, smoke-tested and published by the Release workflow's
# own steps and signed with the prerelease key (deploy/README.md, "Prereleases"). The run on main publishes, only when
# next moved since the previous nightly and CI and Repo compliance passed on next's head; otherwise it builds and
# publishes nothing. It then keeps the last 14 nightlies and deletes older ones. A manual run on any other branch is
# a dry run of that branch's own commit that signs with a throwaway key and reaches neither signing key.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scheduled-failure:
    needs: [prerelease, prune]
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: scheduled-failure-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { reportScheduledFailure } = await import('${{ github.workspace }}/scripts/release/scheduled-failure.mjs');
            await reportScheduledFailure({ github, context, failed: true });
  prerelease:
    # The most the called jobs may use: the plan reads workflow runs, and only the publish job on main, in the
    # prerelease-main environment, writes the tag, release and image.
    # The called workflow sees an environment's secrets only when its caller passes secrets on, so this inherits.
    # The repository and organization hold no secrets; each key lives in its own environment, and prerelease-main
    # admits only the main branch, so this run can reach PRERELEASE_SIGNING_KEY and never RELEASE_SIGNING_KEY.
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      prerelease: true
  prune:
    # Keep the last 14 nightly prereleases: delete older nightly releases, their tags and their images, never a stable
    # release, a draft or an earlier v0.Y.Z prerelease. Runs whether or not tonight's nightly published.
    needs: [prerelease]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Delete nightlies older than the last 14
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/prune-nightlies.mjs "$GITHUB_REPOSITORY"
