# SPDX-License-Identifier: AGPL-3.0-only
name: Upgrade
on:
  push:
    branches: [main, 'task/**', 'integration/**']
    tags: ['v*']
    paths: ['e2e/upgrade/**', 'packages/db/src/migrations/**', '.github/workflows/upgrade.yml']
  pull_request:
    paths: ['e2e/upgrade/**', 'packages/db/src/migrations/**', '.github/workflows/upgrade.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: plaingym:upgrade-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: pnpm --dir e2e exec playwright install chromium
        timeout-minutes: 5
      - run: node --test e2e/upgrade/history.test.mjs
      - run: node scripts/release/build-image.mjs "$IMAGE"
      - run: node e2e/upgrade/run.mjs "$IMAGE"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-report
          path: e2e/coverage/upgrade/
          retention-days: 7
      - name: Remove the throwaway image
        if: ${{ always() }}
        run: timeout 120 docker image rm "$IMAGE"
