# SPDX-License-Identifier: AGPL-3.0-only
name: Image checks
on:
  push:
    branches: [main, 'integration/**']
    paths:
      - 'deploy/**'
      - 'apps/**'
      - 'packages/**'
      - '*lock*'
      - '*package*'
      - 'pnpm-workspace.yaml'
      - 'scripts/release/version*.mjs'
      - 'scripts/release/shellcheck.mjs'
      - '.npmrc'
      - 'tsconfig*.json'
      - 'THIRD_PARTY_LICENSES'
      - '.github/workflows/image*.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reuse:
    # main only receives fast-forwards of integration branches whose CI passed, so the same commit has
    # already been checked: reuse that run's result instead of repeating it. Any lookup failure checks again.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api "repos/${{ github.repository }}/actions/workflows/image.yml/runs?head_sha=${{ github.sha }}&status=success" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length' || echo 0)"
          if [ "$count" -gt 0 ]; then echo passed=true; else echo passed=false; fi >> "$GITHUB_OUTPUT"
  native:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.passed != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    # A run with a migration also builds and starts the previous code's image.
    timeout-minutes: 40
    env:
      IMAGE: plaingym:v0.0.0-ci-${{ matrix.arch }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Compute the build version
        run: echo "VERSION=$(node scripts/release/version-cli.mjs)" >> "$GITHUB_ENV"
      - name: Check scripts and configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          node scripts/release/shellcheck.mjs
          sudo env CI=true PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/demo -p 'test_*.py'
      - name: Test compatibility smoke selection and cleanup
        run: node --test deploy/release/*.test.mjs
      - name: Test update orchestration
        run: sudo sh deploy/test/update.sh
      - name: Test automatic patch updates
        run: sudo sh deploy/test/patch.sh
      - name: Test updates across a rollback floor
        run: sudo sh deploy/test/floor.sh
      - name: Test key rotation orchestration
        run: sudo sh deploy/test/rotate-key.sh
      - name: Test the release scripts
        if: matrix.arch == 'amd64'
        run: sh deploy/test/release.sh
      - name: Test rollback by digest
        if: matrix.arch == 'amd64'
        run: sudo sh deploy/test/rollback.sh
      - name: Test install and bootstrap checks
        run: sudo sh deploy/test/install.sh
      # Keep runtime layers, especially the pinned snapshot apt install, without exporting intermediate source
      # and dependency layers on each push. The weekly scan retains mode=max on main; branches can fall back
      # to that cache. The pnpm store mount is not exported. A cache failure never fails the build.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build on the native CPU
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            SOURCE_URL=${{ env.SOURCE_URL }}
            REVISION=${{ env.REVISION }}
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=min,ignore-error=true
      - name: Check the built architecture
        run: test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = "${{ matrix.arch }}"
      - name: Test the production stack
        run: node deploy/test/smoke.mjs "$IMAGE"
      - name: Test compatibility harness with the current image
        if: matrix.arch == 'amd64'
        run: node --input-type=module -e 'import { smokePreviousImage } from "./deploy/release/previous-smoke.mjs"; smokePreviousImage(process.env.IMAGE, process.env.IMAGE, process.cwd(), "HEAD");'
      - name: Test missing build arguments and archive image identity
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          if docker build --target build -f deploy/Dockerfile . > "$RUNNER_TEMP/missing-identity.log" 2>&1; then
            echo '::error::A direct image build without identity must fail.'; exit 1
          fi
          grep -q 'Supply VERSION and REVISION build arguments' "$RUNNER_TEMP/missing-identity.log"
          archive_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version + "+unknown"')
          trap 'timeout -k 5 120 docker image rm -f "$IMAGE-archive" || echo "::warning::Archive image cleanup failed"' EXIT
          docker build --load -f deploy/Dockerfile --build-arg "VERSION=$archive_version" --build-arg REVISION=unknown \
            --build-arg "SOURCE_URL=$SOURCE_URL" -t "$IMAGE-archive" .
          test "$(docker image inspect "$IMAGE-archive" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$archive_version"
          test "$(docker image inspect "$IMAGE-archive" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = unknown
          VERSION="$archive_version" node deploy/test/smoke.mjs "$IMAGE-archive"
      - name: Run the previous code on this schema
        if: matrix.arch == 'amd64'
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          # Before the first release: the code this branch left main at, or the code main held before this push.
          base=$BEFORE
          if [ "$GITHUB_REF" != refs/heads/main ] || [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base=$(git merge-base origin/main HEAD)
          fi
          node deploy/release/previous-code.mjs "$IMAGE" "$base"
      - name: Export tested image
        run: docker save "$IMAGE" -o "${{ runner.temp }}/image-${{ matrix.arch }}.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          retention-days: 3
  manifest:
    needs: native
    # A skipped reuse job (every run except a push to main) would otherwise skip this job as well.
    if: ${{ !cancelled() && needs.native.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Assemble and inspect in a temporary local registry
        # Only this runner's loopback registry receives images. No credentials,
        # external registry writes, repository tags, or release assets are used.
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name image-registry -p 127.0.0.1:5000:5000 registry:3@sha256:b3419cf99f8ec65bbda73e8a950fd26861012689beaf7b6577ee938995aa7d3f
          trap 'docker rm -f image-registry >/dev/null' EXIT
          for arch in amd64 arm64; do
            docker load -i "$RUNNER_TEMP/images/image-$arch.tar"
            docker tag "plaingym:v0.0.0-ci-$arch" "localhost:5000/plaingym:$arch"
            docker push "localhost:5000/plaingym:$arch"
          done
          docker manifest create --insecure localhost:5000/plaingym:test localhost:5000/plaingym:amd64 localhost:5000/plaingym:arm64
          docker manifest push --insecure localhost:5000/plaingym:test
          docker manifest inspect --insecure localhost:5000/plaingym:test > "$RUNNER_TEMP/manifest.json"
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64","linux/arm64"]' "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-manifest
          path: ${{ runner.temp }}/manifest.json
          retention-days: 3
