x-postgres: &postgres
  image: postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
  entrypoint: [bash, -c, 'install -m 0644 /opt/01-roles.sh /docker-entrypoint-initdb.d/01-roles.sh && exec docker-entrypoint.sh "$$@"', --]
  command: [postgres]
  environment: &database-env
    POSTGRES_DB: plaingym
    POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?required}
    APP_PASSWORD: ${E2E_APP_PASSWORD:?required}
    MAINTENANCE_PASSWORD: ${E2E_MAINTENANCE_PASSWORD:?required}
  volumes: ['../dev/postgres/01-roles.sh:/opt/01-roles.sh:ro']
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d plaingym']
    interval: 2s
    timeout: 3s
    retries: 30
x-app-env: &app-env
  <<: *database-env
  AUTH_SECRET: ${E2E_AUTH_SECRET:?required}
  APP_ENCRYPTION_KEY: ${E2E_ENCRYPTION_KEY:?required}
  SETUP_TOKEN: ${E2E_SETUP_TOKEN:?required}
  UPLOADS_DIR: /var/lib/plaingym/uploads
  BACKUP_STAGING_DIR: /var/lib/plaingym/staging
  # Every browser and API request reaches the app from Caddy's one address; the default
  # 300 per minute would make the specs wait for fresh windows (unit tests cover the limiter).
  RATE_LIMIT_PER_MINUTE: '20000'
services:
  postgres: *postgres
  demo-postgres: *postgres
  app:
    image: ${E2E_IMAGE:?required}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *app-env
      PUBLIC_ORIGIN: https://gym.localhost
      TENANCY: single
      AUTH_PASSWORD_LOGIN: 'on'
      DATABASE_URL: postgres://app:${E2E_APP_PASSWORD}@postgres:5432/plaingym
      MAINTENANCE_DATABASE_URL: postgres://maintenance:${E2E_MAINTENANCE_PASSWORD}@postgres:5432/plaingym
  # S3-compatible storage for demo sandboxes: the seed stores waiver signature images.
  demo-s3:
    image: versity/versitygw:v1.0.20@sha256:c2f9b9289d237b85736214dfbef376b7d092b8540e1456d547aaa35dd03ad0b3
    entrypoint: [sh, -c, 'mkdir -p /data/plaingym && exec versitygw --port :7070 --region auto posix /data']
    environment:
      ROOT_ACCESS_KEY: e2e
      ROOT_SECRET_KEY: ${E2E_S3_SECRET:?required}
  demo:
    image: ${E2E_IMAGE:?required}
    depends_on:
      demo-postgres: {condition: service_healthy}
      demo-s3: {condition: service_started}
    environment:
      <<: *app-env
      PGHOST: demo-postgres
      PUBLIC_ORIGIN: https://demo.localhost
      TENANCY: multi
      DEMO_MODE: 'true'
      DEMO_DOMAIN: demo.localhost
      AUTH_PASSWORD_LOGIN: 'off'
      DATABASE_URL: postgres://app:${E2E_APP_PASSWORD}@demo-postgres:5432/plaingym
      MAINTENANCE_DATABASE_URL: postgres://maintenance:${E2E_MAINTENANCE_PASSWORD}@demo-postgres:5432/plaingym
      # Visitor uploads stay disabled; only the seed and generated waiver PDFs write here.
      UPLOADS_S3_BUCKET: plaingym
      UPLOADS_S3_ENDPOINT: http://demo-s3:7070
      UPLOADS_S3_ACCESS_KEY_ID: e2e
      UPLOADS_S3_SECRET_ACCESS_KEY: ${E2E_S3_SECRET}
  caddy:
    image: caddy:2.11.7-alpine@sha256:3095ad245c353e3bdb27a38f22a095c1cfa9e295ab21c0214c3e72b0e2960525
    ports: ['127.0.0.1:443:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro']
    depends_on:
      app: {condition: service_healthy}
      demo: {condition: service_healthy}
