x-postgres: &postgres
  image: postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
  entrypoint: [bash, -c, 'install -m 0644 /opt/01-roles.sh /docker-entrypoint-initdb.d/01-roles.sh && exec docker-entrypoint.sh "$$@"', --]
  command: [postgres]
  environment: &database-env
    POSTGRES_DB: plaingym
    POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?required}
    APP_PASSWORD: ${E2E_APP_PASSWORD:?required}
    MAINTENANCE_PASSWORD: ${E2E_MAINTENANCE_PASSWORD:?required}
  volumes: ['../dev/postgres/01-roles.sh:/opt/01-roles.sh:ro']
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d plaingym']
    interval: 2s
    timeout: 3s
    retries: 30
x-app-env: &app-env
  POSTGRES_DB: plaingym
  APP_PASSWORD: ${E2E_APP_PASSWORD:?required}
  AUTH_SECRET: ${E2E_AUTH_SECRET:?required}
  APP_ENCRYPTION_KEY: ${E2E_ENCRYPTION_KEY:?required}
  SETUP_TOKEN: ${E2E_SETUP_TOKEN:?required}
  UPLOADS_DIR: /var/lib/plaingym/uploads
  # Every browser and API request reaches the app from Caddy's one address; the default
  # 300 per minute would make the specs wait for fresh windows (unit tests cover the limiter).
  RATE_LIMIT_PER_MINUTE: '20000'
services:
  postgres: *postgres
  demo-postgres: *postgres
  app:
    image: ${E2E_IMAGE:?required}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *app-env
      PUBLIC_ORIGIN: https://gym.localhost
      TENANCY: single
      AUTH_PASSWORD_LOGIN: 'on'
      DATABASE_URL: postgres://app:${E2E_APP_PASSWORD}@postgres:5432/plaingym
      MAINTENANCE_PASSWORD: ${E2E_MAINTENANCE_PASSWORD:?required}
      MAINTENANCE_DATABASE_URL: postgres://maintenance:${E2E_MAINTENANCE_PASSWORD}@postgres:5432/plaingym
      BACKUP_STAGING_DIR: /var/lib/plaingym/staging
  # Multi-gym mode: only this one-shot step holds the maintenance role. It checks the roles and
  # migrates the demo database, then exits before the demo app starts without the role.
  demo-migrate:
    image: ${E2E_IMAGE:?required}
    entrypoint: [/app/deploy/database.sh, prepare]
    healthcheck: {disable: true}
    depends_on:
      demo-postgres: {condition: service_healthy}
    environment:
      PGHOST: demo-postgres
      POSTGRES_DB: plaingym
      APP_PASSWORD: ${E2E_APP_PASSWORD:?required}
      MAINTENANCE_PASSWORD: ${E2E_MAINTENANCE_PASSWORD:?required}
      MAINTENANCE_DATABASE_URL: postgres://maintenance:${E2E_MAINTENANCE_PASSWORD}@demo-postgres:5432/plaingym
  # S3-compatible storage for demo sandboxes: the seed stores waiver signature images.
  demo-s3:
    image: versity/versitygw:v1.0.20@sha256:c2f9b9289d237b85736214dfbef376b7d092b8540e1456d547aaa35dd03ad0b3
    entrypoint: [sh, -c, 'mkdir -p /data/plaingym && exec versitygw --port :7070 --region auto posix /data']
    environment:
      ROOT_ACCESS_KEY: e2e
      ROOT_SECRET_KEY: ${E2E_S3_SECRET:?required}
  demo:
    image: ${E2E_IMAGE:?required}
    depends_on:
      demo-migrate: {condition: service_completed_successfully}
      demo-s3: {condition: service_started}
      stripe-tls: {condition: service_healthy}
    environment:
      <<: *app-env
      PGHOST: demo-postgres
      PUBLIC_ORIGIN: https://demo.localhost
      TENANCY: multi
      DEMO_MODE: 'true'
      DEMO_DOMAIN: demo.localhost
      AUTH_PASSWORD_LOGIN: 'off'
      DATABASE_URL: postgres://app:${E2E_APP_PASSWORD}@demo-postgres:5432/plaingym
      # Visitor uploads stay disabled; only the seed and generated waiver PDFs write here.
      UPLOADS_S3_BUCKET: plaingym
      UPLOADS_S3_ENDPOINT: http://demo-s3:7070
      UPLOADS_S3_ACCESS_KEY_ID: e2e
      UPLOADS_S3_SECRET_ACCESS_KEY: ${E2E_S3_SECRET}
      # Sandbox billing uses the fake Stripe below; the specs sign its webhooks with this secret.
      DEMO_STRIPE_TEST_KEY: ${E2E_STRIPE_KEY:?required}
      DEMO_STRIPE_WEBHOOK_SECRET: ${E2E_STRIPE_WEBHOOK_SECRET:?required}
      NODE_EXTRA_CA_CERTS: /stripe-ca/root.crt
    volumes: ['stripe-ca:/stripe-ca:ro']
  # A stateful stand-in for the Stripe API (stripe/server.mjs), so joins complete without Stripe keys.
  stripe:
    image: node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    user: node
    init: true
    command: [node, /fake/server.mjs]
    volumes: ['./stripe/server.mjs:/fake/server.mjs:ro']
    environment:
      STRIPE_SECRET_KEY: ${E2E_STRIPE_KEY:?required}
      CHECKOUT_ORIGIN: https://stripe.localhost
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:12111/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  # Serves the fake as api.stripe.com on this network; the demo install trusts its exported local CA.
  stripe-tls:
    image: caddy:2.11.7-alpine@sha256:3095ad245c353e3bdb27a38f22a095c1cfa9e295ab21c0214c3e72b0e2960525
    init: true
    # Caddy keeps its CA on a volume across restarts; the export is written whole before it is renamed into place.
    entrypoint: [sh, -c, 'caddy run --config /etc/caddy/Caddyfile --adapter caddyfile & until [ -s /data/caddy/pki/authorities/local/root.crt ]; do sleep 0.2; done; cp /data/caddy/pki/authorities/local/root.crt /ca/.root.crt && chmod 0644 /ca/.root.crt && mv -f /ca/.root.crt /ca/root.crt; wait']
    volumes: ['./stripe/Caddyfile:/etc/caddy/Caddyfile:ro', 'stripe-ca:/ca', 'stripe-tls-data:/data']
    networks:
      default: {aliases: [api.stripe.com]}
    depends_on:
      stripe: {condition: service_healthy}
    healthcheck:
      test: [CMD, test, -s, /ca/root.crt]
      interval: 2s
      timeout: 3s
      retries: 30
  caddy:
    image: caddy:2.11.7-alpine@sha256:3095ad245c353e3bdb27a38f22a095c1cfa9e295ab21c0214c3e72b0e2960525
    ports: ['${E2E_LOOPBACK:-127.0.0.1}:443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dev/https/Caddyfile:/etc/caddy/demo.Caddyfile:ro
    depends_on:
      app: {condition: service_healthy}
      demo: {condition: service_healthy}
      stripe: {condition: service_healthy}
volumes:
  stripe-ca: {}
  stripe-tls-data: {}
