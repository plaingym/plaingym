services:
  postgres:
    image: postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    # Windows bind mounts do not preserve Unix modes; copy the public init script.
    entrypoint:
      - bash
      - -c
      - 'install -m 0644 /opt/plaingym-dev/01-roles.sh /docker-entrypoint-initdb.d/01-roles.sh && exec docker-entrypoint.sh "$$@"'
      - --
    command: [postgres]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_PASSWORD: ${APP_PASSWORD:?required}
      MAINTENANCE_PASSWORD: ${MAINTENANCE_PASSWORD:?required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./dev/postgres/01-roles.sh:/opt/plaingym-dev/01-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  pgdata:
